<!DOCTYPE html>
<html>
<head>
    <meta name="screen-orientation" content="portrait">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0" />
    <title>Kết Quả Quay Số May Mắn</title>
    <link rel="stylesheet" type="text/css" href="css/reset.css">
    <link rel="stylesheet" type="text/css" href="css/result.css">
</head>
<body>
    <div id="app" class="container">
        <div class="header">
            <h1>KẾT QUẢ QUAY SỐ</h1>
        </div>
        <div class="results-grid">
            <div v-for="result in sortedResults" :key="result.prize" class="prize-card">
                <h2 class="prize-title">{{ result.prize }}</h2>
                <ol class="winners-list">
                    <li v-for="(winner, index) in result.winners" :key="index" class="winner-item">
                        <div class="winner-details">
                            <span class="winner-name">{{ winner[0] }}</span>
                            <span class="winner-id">{{ winner[1] }}</span>
                        </div>
                    </li>
                </ol>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/vue.js"></script>
    <script type="text/javascript">
        new Vue({
            el: '#app',
            data: {
                results: []
            },
            computed: {
                sortedResults() {
                    const prizeOrder = [
                        'Đặc Biệt',
                        'Giải Nhất',
                        'Giải Nhì',
                        'Giải Ba',
                        'Khuyến Khích',
                        'Khích Lệ',
                        'Giải Bonus'
                    ];

                    const groupedResults = {};

                    this.results.forEach(result => {
                        // Extract the main prize name (e.g., "Giải Nhất" from "Giải Nhất - 一等奖")
                        const prizeName = result.prize.split(' - ')[0];

                        if (!groupedResults[prizeName]) {
                            groupedResults[prizeName] = {
                                prize: prizeName,
                                winners: []
                            };
                        }
                        groupedResults[prizeName].winners.push(...result.winners);
                    });

                    return Object.values(groupedResults).sort((a, b) => {
                        const indexA = prizeOrder.indexOf(a.prize);
                        const indexB = prizeOrder.indexOf(b.prize);
                        // If a prize is not in the order list, push it to the back
                        if (indexA === -1) return 1;
                        if (indexB === -1) return -1;
                        return indexA - indexB;
                    });
                }
            },
            mounted() {
                const loadedResults = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    // Ensure we only read result keys, not the 'choosed' list or others
                    if (key !== 'choosed' && key !== 'lastSelectedIndex') {
                        try {
                            const data = JSON.parse(localStorage.getItem(key));
                            if (data && data.prize && data.winners) {
                                loadedResults.push(data);
                            }
                        } catch (e) {
                            console.error('Could not parse localStorage item:', key, e);
                        }
                    }
                }
                this.results = loadedResults;
            }
        });
    </script>
</body>
</html>
