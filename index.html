<!DOCTYPE html>
<html>

<head>
    <meta name="screen-orientation" content="portrait">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0" />
    <title>FIT_FAD_R&D</title>
    <link rel="stylesheet" type="text/css" href="css/reset.css">
    <link rel="stylesheet" type="text/css" href="css/wall.css">
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        body,
        html {
            width: 100%;
            height: 100%;
        }

        .alert-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .winner {
            display: inline-block;
            margin: 10px;
            text-align: center;
            color: #000;
        }

        .winner img {
            width: 15vw;
            /* 15% chiều rộng màn hình */
            height: 15vw;
            max-width: 160px;
            /* không quá lớn */
            max-height: 160px;
            border-radius: 50%;
            border: 3px solid #ff9800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .winner-item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            color: #000;
            margin: 5px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.8);
            padding: 10px;
        }


        .alert-box {
            background: #fff;
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 260px;
        }

        .alert-box h3 {
            margin-bottom: 10px;
            color: #e53935;
        }

        .alert-box button {
            margin-top: 15px;
            padding: 6px 20px;
            border: none;
            background: #2196f3;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            /* xếp hàng */
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            pointer-events: auto;
            overflow: auto;
            gap: 5px;
            /* khoảng cách giữa các hàng */
            background-color: transparent;
        }

        .result .row {
            display: flex;
            justify-content: center;
            /* căn giữa từng hàng */
            gap: 15px;
            /* khoảng cách giữa từng người trong hàng */
        }

        .result .winner {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .winner-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            /* Center items vertically */
            align-content: center;
            /* Pack rows together */
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .prize-title {
            font-size: 45px;
            font-weight: bold;
            color: '#b0f876',
                /* LemonChiffon for high contrast */
                /* text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px; */
        }

        .winner-item-text-only {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: none;
            padding: 0;
            text-align: center;
            margin: 5px;
            /* Added margin for spacing */
        }

        .winner-name {
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            color: #fbff00;
            /* LemonChiffon for high contrast */
            font-weight: bold;
            font-family: 'Dancing Script', cursive;
            font-size: 30px;
            width: auto;
            padding: 2px;
            text-align: center;
            line-height: 1.2em;
        }

        .winner-phone {
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            color: #fbff00;
            /* Cornsilk for high contrast */
            font-size: 27px;
            /* Increased by 1.5x from 18px */
            font-family: 'Dancing Script', cursive;
            width: auto;
            padding: 2px;
            text-align: center;
            line-height: 1.2em;
        }

        /* 1 người */
        .single-winner {
            /* grid-template-columns: 1fr; */
            font-size: 4rem;
            /* Larger base font for single winner */
        }

        .single-winner .winner-name {
            font-size: 8vw;
            /* Very large font for name */
        }

        .single-winner .winner-phone {
            font-size: 7.5vw;
            /* Increased by 1.5x from 5vw */
        }

        /* 2 người */
        .two-winners {
            /* grid-template-columns: 1fr;
            grid-template-rows: repeat(2, 1fr); */
            flex-direction: column;
        }

        .two-winners .winner-name {
            font-size: 6vw;
        }

        .two-winners .winner-phone {
            font-size: 4.5vw;
            /* Increased by 1.5x from 3vw */
        }

        .two-winners .winner-item-text-only {
            margin-bottom: 10px;
        }

        /* 8 người */
        .eight-winners {
            /* grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr); */
        }

        .eight-winners .winner-item-text-only,
        .ten-winners .winner-item-text-only {
            flex: 0 1 45%;
            /* Create a 2-column layout */
            margin-bottom: 20px;
            /* Increased vertical spacing between rows */
        }

        .eight-winners .winner-name,
        .ten-winners .winner-name {
            font-size: 3.5rem;
        }

        .eight-winners .winner-phone,
        .ten-winners .winner-phone {
            font-size: 2.625rem;
            /* Increased by 1.5x from 1.75rem */
        }

        /* 10 người */
        .ten-winners {
            /* grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr); */
        }

        /* Nhiều người (mặc định) */
        .multiple-winners {
            /* grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); */
        }

        #home-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;

        }

        #home-screen img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: inherit;
        }


        .lottery-controls .pure-button {
            width: 160px;
            height: auto;
            padding: 3px 0;
            border-radius: 15px;
            border: none;
            color: #fff;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
        }

        #current-prize-title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5rem;
            font-weight: bold;
            font-family: 'Dancing Script', cursive;

            /* Thêm dòng này để đổi màu chữ */
            color: #fbff00;

            /* Giữ nguyên shadow để chữ nổi bật trên nền tối */
            text-shadow: 0 0 10px black, 0 0 20px #fbff00;
            z-index: 100;
            text-align: center;
            white-space: nowrap;
        }

        #myCanvas {
            /* display: block; */
        }


        /* Text */
        .lottery-controls .vi {
            display: block;
            font-size: 18px;
            font-weight: bold;
        }

        .lottery-controls .cn {
            display: block;
            font-size: 14px;
            opacity: 0.85;
        }

        /* Màu */
        .lottery-controls .btn-start {
            background: linear-gradient(135deg, #ff5722, #ff9800);
        }

        .lottery-controls .btn-stop {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
        }

        .lottery-controls .btn-reset {
            background: linear-gradient(135deg, #2196f3, #03a9f4);
        }

        /* Disable */
        .lottery-controls .pure-button:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            box-shadow: none;
        }


        .result span {
            display: inline-block;
            font-size: 25px;
            /* width: 170px; */
            background: transparent;
            /* line-height: 30px; */
            margin: 0px;
            border-radius: 10px;
            box-shadow: none;
            padding: 2px 10px;
            text-align: center;
        }

        button,
        input,
        optgroup,
        select,
        textarea {
            color: inherit;
            font: inherit;
            margin: 0;
            border: none;
        }

        button {
            overflow: visible;
        }

        button,
        select {
            text-transform: none;
        }

        button,
        html input[type=button],
        input[type=reset],
        input[type=submit] {
            -webkit-appearance: button;
            cursor: pointer;
        }

        .pure-button {
            display: inline-block;
            zoom: 1;
            line-height: normal;
            white-space: nowrap;
            vertical-align: middle;
            text-align: center;
            cursor: pointer;
            -webkit-user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }

        .pure-button {
            font-family: inherit;
            font-size: 100%;
            padding: .5em 1em;
            color: #444;
            color: rgba(0, 0, 0, .8);
            border: 0 rgba(0, 0, 0, 0);
            background-color: #E6E6E6;
            text-decoration: none;
            border-radius: 15px;
        }

        .pure-button:focus {
            outline: 0
        }

        .pure-button-hover,
        .pure-button:hover,
        .pure-button:focus {
            filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#00000000', endColorstr='#1a000000', GradientType=0);
            background-image: -webkit-gradient(linear, 0 0, 0 100%, from(transparent), color-stop(40%, rgba(0, 0, 0, .05)), to(rgba(0, 0, 0, .1)));
            background-image: -webkit-linear-gradient(transparent, rgba(0, 0, 0, .05) 40%, rgba(0, 0, 0, .1));
            background-image: -moz-linear-gradient(top, rgba(0, 0, 0, .05) 0, rgba(0, 0, 0, .1));
            background-image: -o-linear-gradient(transparent, rgba(0, 0, 0, .05) 40%, rgba(0, 0, 0, .1));
            background-image: linear-gradient(transparent, rgba(0, 0, 0, .05) 40%, rgba(0, 0, 0, .1));
        }

        .button-success,
        .button-error,
        .button-warning,
        .button-secondary {
            color: white;
            border-radius: 4px;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
        }

        .button-success {
            background: rgb(28, 184, 65);
        }

        .button-error {
            background: rgb(202, 60, 60);
        }

        .button-warning {
            background: rgb(223, 117, 20);
        }

        .button-secondary {
            background: rgb(66, 184, 221);
        }

        .tools {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
        }

        /* BÊN TRÁI */
        .tools-left {
            display: flex;
            /* gap: 10px; */
            flex-wrap: wrap;
            max-width: 65%;
        }

        /* BÊN PHẢI */
        .tools-right {
            display: flex;
            flex-direction: inherit;
            gap: 12px;
            align-items: center;
        }

        /* =========================
   FIX HOVER BỊ MỜ NÚT CHÍNH
   ========================= */

        /* Ghi đè hover mặc định của pure-button */
        .lottery-controls .pure-button:hover,
        .lottery-controls .pure-button:focus {
            background-image: none !important;
            filter: none !important;
            opacity: 1 !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Hiệu ứng sáng theo từng nút */
        .lottery-controls .btn-start:hover {
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.9);
        }

        .lottery-controls .btn-stop:hover {
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.9);
        }

        .lottery-controls .btn-reset:hover {
            box-shadow: 0 0 20px rgba(3, 169, 244, 0.9);
        }



        .tools .pure-button {
            display: inline-block;
            margin: 5px;
            /* padding: 10px 0; */
            text-align: center;
            width: 150px;
            font-size: 13px;
        }

        .mask {
            -webkit-filter: blur(8px);
            filter: blur(8px);
        }

        #main {
            position: relative;
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-btn {
            position: fixed;
            top: 25px;
            right: 1px;
            z-index: 20000;
        }

        .home-btn {
            display: none;
            position: fixed;
            top: 5px;
            right: 1px;
            z-index: 20000;
        }
    </style>
</head>

<body>
    <!-- ===== TRANG CHỦ ===== -->
    <div id="home-screen">
        <img src="img/home.png">
    </div>



    <div id="customAlert" class="alert-mask" style="display:none">
        <div class="alert-box">
            <h3>Thông báo</h3>
            <p>Giải này đã quay xong！<br>该奖项已抽完！</p>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>

    <div id="customResetAlert" class="alert-mask" style="display:none">
        <div class="alert-box">
            <h3>Thông báo</h3>
            <p style="font-size:18px; font-weight:bold;">
                Bạn có chắc chắn muốn cài lại không?<br>
                <span style="font-size:14px; font-weight:normal;">
                    确定要重置么？
                </span><br>
                Tất cả lịch sử quay trước đó sẽ bị xóa!
            </p>
            <button onclick="confirmReset()">OK</button>
            <button onclick="closeResetAlert()" style="margin-left:10px;">Hủy</button>
        </div>
    </div>
    <!-- Thêm nhạc nền tại đây -->
    <audio id="bgMusic" src="audio/tatNien2024(30s).mp3" loop></audio>

    <div id="current-prize-title"></div>
    <div id="main" class="wall">
    </div>
    <div id="result" class="result">
    </div>
    <div id="tools" class="tools">
        <!-- BÊN TRÁI: CÁC GIẢI -->
        <div class="tools-left">
            <button v-for="(item, index) in btns" @click="onClick(item, index)"
                @contextmenu.prevent="editQuantity(item, index)" class="pure-button" :disabled="item.done" :class="{ 'button-error': selectedIndex === index,
                  'button-secondary': item.done }" style="line-height:1.2;width: 140px;padding:3px 0;">
                <div style="font-size:13px;font-weight:bold">{{ item.label }}</div>
                <div style="font-size:11px;color:#444">{{ item.cn }}</div>
                <div style="font-size:10px;margin-top:2px">
                    {{ item.done ? 0 : item.value }}
                </div>
            </button>
        </div>

        <!-- BÊN PHẢI: NÚT ĐIỀU KHIỂN -->
        <div class="tools-right lottery-controls">
            <button v-if="showBackButton" class="pure-button btn-main btn-start" @click.stop="confirmResult">
                <span class="vi">Quay lại</span>
                <span class="cn">返回</span>
            </button>
            <button v-if="!showBackButton" class="pure-button btn-main btn-start" @click.stop="startLottery"
                :disabled="running">
                <span class="vi">{{ running ? 'ĐANG QUAY...' : 'BẮT ĐẦU' }}</span>
                <span class="cn">{{ running ? '抽奖中...' : '开始' }}</span>
            </button>
            <button v-else disabled class="pure-button btn-main btn-start">
                <span class="vi">BẮT ĐẦU</span>
                <span class="cn">开始</span>
            </button>
            <button class="pure-button btn-reset" @click.stop="showResetAlert">
                <span class="vi">CÀI LẠI</span>
                <span class="cn">重置</span>
            </button>
        </div>
    </div>

    <script type="text/javascript" src="js/zepto.js"></script>
    <script type="text/javascript" src="js/vue.js"></script>
    <script type="text/javascript" src="js/tagcanvas.js"></script>
    <script type="text/javascript" src="js/member.js"></script>
    <script>
        var needConfirm = false;
    </script>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.code === 'Enter' || e.code === 'Space') {
                e.preventDefault();
                const homeBtn = document.querySelector('.home-btn');
                if (homeBtn) {
                    homeBtn.style.display = 'flex'; // tránh page scroll
                }

                const home = document.getElementById('home-screen');
                if (home && home.style.display !== 'none') {
                    home.style.display = 'none';
                    return;
                }
                window.appVue.startLottery();                   // ★ gọi chung 1 hàm
            }
        });


    </script>


    <script type="text/javascript">
        (function () {
            var choosed = JSON.parse(localStorage.getItem('choosed')) || {};
            var bgMusic = document.getElementById('bgMusic'); // 🎵 nhạc nền
            var isToggling = false;

            console.log(choosed);
            var speed = function () {
                return [0.1 * Math.random() + 0.01, -(0.1 * Math.random() + 0.01)];
            };
            var getKey = function (item) {
                return item.name + '-' + item.phone;
            };
            var createHTML = function () {
                var html = ['<ul>'];
                member.forEach(function (item, index) {
                    item.index = index;
                    var key = getKey(item);
                    var color = choosed[key] ? 'yellow' : 'white';
                    html.push('<li><a href="#" style="color: ' + color + ';">' + item.name + '</a></li>');
                });
                html.push('</ul>');
                return html.join('');
            };
            // var lottery = function (count) {
            //     var list = canvas.getElementsByTagName('a');
            //     var color = 'yellow';
            //     var ret = member
            //         .filter(function (m, index) {
            //             m.index = index;
            //             return !choosed[getKey(m)];
            //         })
            //         .map(function (m) {
            //             return Object.assign({
            //                 score: Math.random()
            //             }, m);
            //         })
            //         .sort(function (a, b) {
            //             return a.score - b.score;
            //         })
            //         .slice(0, count)
            //         .map(function (m) {
            //             choosed[getKey(m)] = 1;
            //             list[m.index].style.color = color;
            //             return m.name + '<br/>' + m.phone;
            //         });
            //     localStorage.setItem('choosed', JSON.stringify(choosed));
            //     return ret;
            // };
            //tuanlg

            var lottery = function (count) {
                var list = canvas.getElementsByTagName('a');
                var color = 'yellow';

                var remaining = member.filter(m => !choosed[getKey(m)]);

                var ret = remaining
                    .map(m => Object.assign({ score: Math.random() }, m))
                    .sort((a, b) => a.score - b.score)
                    .slice(0, count)
                    .map(m => {
                        choosed[getKey(m)] = 1;
                        list[m.index].style.color = color;

                        // tự tạo đường dẫn ảnh theo phone
                        m.photo = 'img/users/' + m.phone + '.jpg'; // ảnh chính

                        return m;
                    });

                localStorage.setItem('choosed', JSON.stringify(choosed));
                return ret;
            };




            var canvas = document.createElement('canvas');
            canvas.id = 'myCanvas';
            canvas.width = document.body.offsetWidth;
            canvas.height = document.body.offsetHeight;

            document.getElementById('main').appendChild(canvas);
            function renderWinners(ret, prizeLabel) {
                console.log('Winners:', ret); // For debugging
                const winnerCount = ret.length;
                let containerClass = 'winner-container';

                if (winnerCount === 1) {
                    containerClass += ' single-winner';
                } else if (winnerCount === 2) {
                    containerClass += ' two-winners';
                } else if (winnerCount === 8) {
                    containerClass += ' eight-winners';
                } else if (winnerCount === 10) {
                    containerClass += ' ten-winners';
                } else if (winnerCount > 1) {
                    containerClass += ' multiple-winners';
                }

                let html = `<div class="${containerClass}">`;

                ret.forEach(m => {
                    html += `
                        <div class="winner-item-text-only"> <!-- Changed class -->
                            <span class="winner-name">${m.name}</span>
                            <span class="winner-phone">${m.phone}</span>
                        </div>
                    `;
                });

                html += '</div>';

                // Hiển thị kết quả
                $('#result').html(html).show();
                $('#main').addClass('mask');
                needConfirm = true; // 🔒 khóa quay

                // Thêm hiệu ứng pháo hoa
                createConfetti();
            }

            function createConfetti() {
                // Burst chính từ giữa
                confetti({
                    particleCount: 200,
                    spread: 90,
                    origin: { y: 0.6, x: 0.5 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080', '#ffc0cb', '#a52a2a'],
                    scalar: 1.5
                });

                // Burst từ trái
                setTimeout(() => {
                    confetti({
                        particleCount: 100,
                        angle: 60,
                        spread: 70,
                        origin: { x: 0, y: 0.5 },
                        colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080', '#ffc0cb', '#a52a2a'],
                        scalar: 1.5
                    });
                }, 200);

                // Burst từ phải
                setTimeout(() => {
                    confetti({
                        particleCount: 100,
                        angle: 120,
                        spread: 70,
                        origin: { x: 1, y: 0.5 },
                        colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080', '#ffc0cb', '#a52a2a'],
                        scalar: 1.5
                    });
                }, 400);
            }


            window.appVue = new Vue({
                el: '#tools',
                data: {
                    selected: 1,
                    selectedIndex: null,   // 👈 thêm dòng này
                    running: false,
                    showResult: false,
                    showBackButton: false,
                    currentPrizeIndex: 0, // Giải hiện tại đang chờ quay
                    highlightInterval: null,
                    btns: [
                        { label: 'Đặc Biệt', cn: '特别奖', value: 1, done: false },
                        { label: 'Giải Nhất', cn: '一等奖', value: 1, done: false },
                        { label: 'Giải Nhì', cn: '二等奖', value: 2, done: false },
                        { label: 'Giải Ba', cn: '三等奖', value: 8, done: false },
                        { label: 'Khuyến Khích', cn: '鼓励奖', value: 20, done: false },
                        { label: 'Khích Lệ', cn: '安慰奖', value: 50, done: false },
                        { label: 'Giải Bonus', cn: '奖金', value: 10, done: false }
                    ]
                }
                ,
                mounted() {
                    canvas.innerHTML = createHTML();
                    TagCanvas.Start('myCanvas', '', {
                        textColour: null,
                        initial: speed(),
                        dragControl: 1,
                        textHeight: 14
                    });

                    var lastIndex = localStorage.getItem('lastSelectedIndex');
                    if (lastIndex !== null) {
                        var index = parseInt(lastIndex, 10);
                        var lastPrize = this.btns[index];
                        if (lastPrize && !lastPrize.done) {
                            this.selectedIndex = index;
                            this.selected = Math.min(lastPrize.value, 10);
                            document.getElementById('current-prize-title').innerHTML = lastPrize.label + ' - ' + lastPrize.cn;
                        }
                    }
                },
                methods: {
                    confirmResult: function () {
                        document.getElementById('result').style.display = 'none';
                        document.getElementById('main').classList.remove('mask');

                        this.showBackButton = false;
                        this.running = false; // Allow starting a new spin

                        needConfirm = false;
                        TagCanvas.SetSpeed('myCanvas', speed()); // Reset to random speed
                    },
                    showResetAlert: function () {
                        showResetAlert();
                    },
                    onClick: function (item, index) {
                        if (item.done || this.running) return;

                        $('#result').css('display', 'none');
                        $('#main').removeClass('mask');

                        this.selected = Math.min(item.value, 10);
                        this.selectedIndex = index;
                        localStorage.setItem('lastSelectedIndex', index);
                        document.getElementById('current-prize-title').innerHTML = item.label + ' - ' + item.cn;
                    },
                    startLottery: function () {
                        if (this.running || needConfirm) return;

                        // Basic checks from old toggle function
                        if (this.selectedIndex !== null) {
                            var currentPrize = this.btns[this.selectedIndex];
                            if (currentPrize.value <= 0) {
                                showAlert();
                                return;
                            }
                            this.selected = Math.min(currentPrize.value, 10);
                        } else {
                            if (this.selected === 0) {
                                this.selected = 1;
                            }
                        }

                        // --- Start Spinning ---
                        this.running = true;
                        $('#result').css('display', 'none');
                        $('#main').removeClass('mask');

                        bgMusic.currentTime = 0;
                        bgMusic.play();
                        TagCanvas.SetSpeed('myCanvas', [5, 1]);

                        // --- Set Timeout to start the slowdown process ---
                        var spinDuration = 5000; // 5 seconds at full speed
                        setTimeout(() => {
                            // --- Start Gradual Slowdown ---
                            var currentSpeedX = 5;
                            var currentSpeedY = 1;
                            var slowdownInterval = setInterval(() => {
                                currentSpeedX *= 0.95; // Exponential decay factor
                                currentSpeedY *= 0.95;
                                TagCanvas.SetSpeed('myCanvas', [currentSpeedX, currentSpeedY]);

                                // Stop when speed is negligible
                                if (Math.abs(currentSpeedX) < 0.05 && Math.abs(currentSpeedY) < 0.05) {
                                    clearInterval(slowdownInterval);
                                    TagCanvas.SetSpeed('myCanvas', [0, 0]); // Full stop

                                    // --- Officially End Spin ---
                                    bgMusic.pause();
                                    var ret = lottery(this.selected);
                                    var prizeLabel = this.selectedIndex !== null ? this.btns[this.selectedIndex].label : "GIẢI PHẦN THƯỞNG";

                                    if (this.selectedIndex !== null) {
                                        var prize = this.btns[this.selectedIndex];
                                        prize.value -= this.selected;
                                        if (prize.value <= 0) {
                                            prize.done = true;
                                        }
                                    }

                                    if (ret.length === 0) {
                                        $('#result').css('display', 'block').html(
                                            '<span style="width: 250px;">' +
                                            '<b style="font-size:32px;color:#d32f2f">Đã hết người</b><br>' +
                                            '<small style="font-size:20px;color:#555">已抽完</small>' +
                                            '</span>'
                                        );
                                        this.running = false; // Allow new spin
                                        return;
                                    }

                                    renderWinners(ret, prizeLabel);
                                    this.showResult = true;
                                    this.showBackButton = true;
                                    TagCanvas.Reload('myCanvas');
                                    setTimeout(() => {
                                        var winners = ret.map(item => [item.name, item.phone]);
                                        localStorage.setItem(new Date().toString(), JSON.stringify({ prize: prizeLabel, winners: winners }));
                                        $('#main').addClass('mask');
                                    }, 300);
                                }
                            }, 50); // Update speed every 50ms
                        }, spinDuration);
                    },
                    editQuantity: function (item, index) {
                        if (this.running) return; // Don't allow editing while spinning

                        var currentVal = item.value;
                        var newVal = prompt(`Nhập số lượng mới cho giải "${item.label}":`, currentVal);

                        if (newVal !== null) { // If user didn't cancel prompt
                            var newQuantity = parseInt(newVal, 10);
                            if (!isNaN(newQuantity) && newQuantity >= 0) {
                                item.value = newQuantity;

                                // If quantity is now > 0, reset the 'done' status
                                if (newQuantity > 0) {
                                    item.done = false;
                                }
                            } else {
                                alert('Vui lòng nhập một số hợp lệ.');
                            }
                        }
                    }
                }
            });
        })();
    </script>

    <script>
        document.addEventListener('click', function (e) {
            const result = document.getElementById('result');
            const tools = document.getElementById('tools');
            const main = document.getElementById('main');

            if (!result) return;

            const style = window.getComputedStyle(result);

            // Chỉ xử lý khi kết quả đang hiện
            if (style.display !== 'none') {

                // 🚫 ĐANG CHỜ XÁC NHẬN → KHÔNG CHO ẨN
                if (typeof needConfirm !== 'undefined' && needConfirm) return;

                // ✅ Click ngoài tools + ngoài result mới ẩn
                if (!tools.contains(e.target) && !result.contains(e.target)) {
                    result.style.display = 'none';
                    main.classList.remove('mask');

                    // Reset canvas về trạng thái quay
                    if (window.TagCanvas) {
                        TagCanvas.Reload('myCanvas');
                    }
                }
            }
        });
    </script>

    <script>
        function showAlert() {
            document.getElementById('customAlert').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }
        function showResetAlert() {
            document.getElementById('customResetAlert').style.display = 'flex';
        }
        function closeResetAlert() {
            document.getElementById('customResetAlert').style.display = 'none';
        }
        function confirmReset() {
            // Clear prize title
            const prizeTitleEl = document.getElementById('current-prize-title');
            if (prizeTitleEl) {
                prizeTitleEl.innerHTML = '';
            }
            localStorage.clear();
            location.reload(true);
        }
        function showHome() {
            document.getElementById('home-screen').style.display = 'block';
            const date = document.getElementById('currentDate');
            if (date) {
                date.style.display = 'block';
            }

        }
    </script>
    <script>
        function confirmResult() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('main').classList.remove('mask');
            document.getElementById('restoreResultBtn').style.display = 'none';

            window.appVue.running = false;

            needConfirm = false;   // ✅ MỞ KHÓA
        }
    </script>
    <script>
        function restoreResult() {
            const result = document.getElementById('result');
            const main = document.getElementById('main');
            const btn = document.getElementById('restoreResultBtn');

            if (!needConfirm) return;

            result.style.display = 'flex';
            main.classList.add('mask');
            btn.style.display = 'none';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

     ">

        </button>
