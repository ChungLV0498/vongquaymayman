        body,

            width: 100%;

        .alert-mask {
            position: fixed;

        .winner-item {
            display: flex;

    <!-- ===== TRANG CHỦ ===== -->
    <div id="home-screen">
        <img src="img_webp/home.webp" alt="Home Background" class="background-image">

    <div id="customAlert" class="alert-mask" style="display:none">
        <div class="alert-box">
            <h3>Thông báo</h3>
            <p>Giải này đã quay xong！<br>该奖项已抽完！</p>

            <h3>Thông báo</h3>
            <p style="font-size:18px; font-weight:bold;">
                Bạn có chắc chắn muốn cài lại không?<br>
                <span style="font-size:14px; font-weight:normal;">
                    确定要重置么？
                </span><br>

            <button onclick="confirmReset()">OK</button>

        </div>

    <div id="noPrizeAlert" class="alert-mask" style="display:none">
        <div class="alert-box">
            <h3>Thông báo</h3>
            <p>Vui lòng chọn giải thưởng trước khi quay!<br>请先选择奖项！</p>
            <button onclick="closeNoPrizeAlert()">OK</button>
        </div>
    </div>
    <!-- Thêm nhạc nền tại đây -->
    <audio id="bgMusic" src="audio/tatNien2024(30s).mp3" loop></audio>

    <div id="current-prize-title"></div>
    <div id="main" class="wall">
    </div>
    <div id="result" class="result">
    </div>
    <div id="tools" class="tools">
        <!-- BÊN TRÁI: CÁC GIẢI -->
        <div class="tools-left" :style="{ visibility: showBackButton ? 'hidden' : 'visible' }">
            <button v-for="(item) in topRowBtns" @click="onClick(item, item.originalIndex)"
                @contextmenu.prevent="editQuantity(item, item.originalIndex)" class="pure-button" :disabled="item.done" :class="{ 'button-error': selectedIndex === item.originalIndex,
                'button-secondary': item.done }" style="line-height:1.2;width: 140px;padding:3px 0;">
                <div style="font-size:13px;font-weight:bold">{{ item.label }}</div>
                <div style="font-size:11px;color:#444">{{ item.cn }}</div>
                <div style="font-size:10px;margin-top:2px">
                    {{ getDisplayValue(item) }}
                </div>
            </button>
            <div style="flex-basis: 100%; height: 0;"></div>
            <button v-for="(item) in bottomRowBtns" @click="onClick(item, item.originalIndex)"
                @contextmenu.prevent="editQuantity(item, item.originalIndex)" class="pure-button" :disabled="item.done" :class="{ 'button-error': selectedIndex === item.originalIndex,
                'button-secondary': item.done }" style="line-height:1.2;width: 140px;padding:3px 0;">
                <div style="font-size:13px;font-weight:bold">{{ item.label }}</div>
                <div style="font-size:11px;color:#444">{{ item.cn }}</div>
                <div style="font-size:10px;margin-top:2px">
                    {{ getDisplayValue(item) }}
                </div>
            </button>
        </div>

        <!-- BÊN PHẢI: NÚT ĐIỀU KHIỂN -->
        <div class="tools-right lottery-controls">
            <button v-if="showBackButton" class="pure-button btn-main btn-start" @click.stop="confirmResult">
                <span class="vi">Quay lại</span>
                <span class="cn">返回</span>
            </button>
            <button v-else class="pure-button btn-main btn-start" @click.stop="startLottery"
                :disabled="running">
                <span class="vi">{{ running ? 'ĐANG QUAY...' : 'BẮT ĐẦU' }}</span>
                <span class="cn">{{ running ? '抽奖中...' : '开始' }}</span>
            </button>
            <button class="pure-button btn-reset" @click.stop="showResetAlert">
                <span class="vi">CÀI LẠI</span>
                <span class="cn">重置</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.code === 'Enter' || e.code === 'Space') {
                e.preventDefault();
                const home = document.getElementById('home-screen');
                if (home && home.style.display !== 'none') {
                    home.style.display = 'none';
                    return;
                }
                
                // Check if 'Quay lại' button is visible (i.e., showBackButton is true)
                if (window.appVue && window.appVue.showBackButton) {
                    window.appVue.confirmResult();
                } else if (window.appVue) { // Otherwise, assume 'BẮT ĐẦU' is visible
                    window.appVue.startLottery();                   // ★ gọi chung 1 hàm
                }
            }
        });
    </script>


                    <script type="text/javascript">


                    (function () {


                        var choosed = JSON.parse(localStorage.getItem('choosed')) || {};


                        var bgMusic = document.getElementById('bgMusic'); // 🎵 nhạc nền


                        var isToggling = false;


            


                        console.log(choosed);            var speed = function () {
                return [0.1 * Math.random() + 0.01, -(0.1 * Math.random() + 0.01)];
            };
            var getKey = function (item) {
                return item.name + '-' + item.phone;
            };
            var createHTML = function () {
                var html = ['<ul>'];
                member.forEach(function (item, index) {
                    item.index = index;
                    var key = getKey(item);
                    var color = choosed[key] ? 'yellow' : 'white';
                    html.push('<li><a href="#" style="color: ' + color + ';">' + item.name + '</a></li>');
                });
                html.push('</ul>');
                return html.join('');
            };

            var lottery = function (count, prizeLabel) { 
                var list = canvas.getElementsByTagName('a');
                var color = 'yellow';

                // Get all members from the original list who haven't already won
                var remainingWithDuplicates = member.filter(m => !choosed[getKey(m)]);

                // Now, create a unique list of potential winners from the remaining list
                const uniqueEligible = [];
                const seenPhones = new Set();
                for (const p of remainingWithDuplicates) {
                    if (!seenPhones.has(p.phone)) {
                        seenPhones.add(p.phone);
                        uniqueEligible.push(p);
                    }
                }

                // Select winners from the unique list
                var ret = uniqueEligible
                    .map(m => Object.assign({ score: Math.random() }, m))
                    .sort((a, b) => a.score - b.score)
                    .slice(0, count)
                    .map(m => {
                        // Mark this person as chosen using their unique key
                        choosed[getKey(m)] = 1;

                        // Find ALL instances of this winner in the original member list and update their color on the canvas
                        for (let i = 0; i < member.length; i++) {
                            if (member[i].phone === m.phone) {
                                list[i].style.color = color;
                            }
                        }

                        // Assign specific prize item if applicable based on sub-draw count
                        if (appVue.prizeItems[prizeLabel] && Array.isArray(appVue.prizeItems[prizeLabel])) {
                           const assignedItem = appVue.prizeItems[prizeLabel][appVue.currentSubDrawCount];
                           if(assignedItem) {
                               m.prizeItem = assignedItem;
                           }
                        }

                        m.photo = 'img_webp/users/' + m.phone + '.webp';
                        return m;
                    });

                localStorage.setItem('choosed', JSON.stringify(choosed));
                return ret;
            };

            var canvas = document.createElement('canvas');
            canvas.id = 'myCanvas';
            canvas.width = document.body.offsetWidth;
            canvas.height = document.body.offsetHeight;

            document.getElementById('main').appendChild(canvas);
            function renderWinners(ret, prizeLabel) {
                console.log('Winners:', ret);
                const winnerCount = ret.length;
                let containerClass = 'winner-container';

                switch (winnerCount) {
                    case 1:
                        containerClass += ' single-winner';
                        break;
                    case 2:
                        containerClass += ' two-winners';
                        break;
                    case 3:
                        containerClass += ' three-winners';
                        break;
                    case 4:
                        containerClass += ' four-winners';
                        break;
                    case 5:
                        containerClass += ' five-winners';
                        break;
                    case 6:
                        containerClass += ' six-winners';
                        break;
                    case 7:
                        containerClass += ' seven-winners';
                        break;
                    case 8:
                        containerClass += ' eight-winners';
                        break;
                    case 9:
                        containerClass += ' nine-winners';
                        break;
                    case 10:
                        containerClass += ' ten-winners';
                        break;
                    case 11:
                        containerClass += ' eleven-winners';
                        break;
                    case 12: // New case for 12 winners
                        containerClass += ' twelve-winners';
                        break;
                    default:
                        containerClass += ' multiple-winners';
                }

                let html = `<div class="${containerClass}">`;

                ret.forEach(m => {
                    html += `
                        <div class="winner-item-text-only">
                            <span class="winner-name">${m.name}</span>
                            <span class="winner-phone">${m.phone}</span>
                        </div>
                    `;
                });

                html += '</div>';

                $('#result').html(html).show();
                $('#main').addClass('mask');
                needConfirm = true;

                document.getElementById('current-prize-title').innerHTML = prizeLabel;
                document.getElementById('current-prize-title').style.color = '#f8ff8f';

                createConfetti();
                
                var randomVicTrack = Math.floor(Math.random() * 3) + 1;
                var vicMusicFile = `audio/m_vic${randomVicTrack}.mp3`;
                bgMusic.src = vicMusicFile;
                bgMusic.loop = false;
                bgMusic.play();
            }
            function createConfetti() {
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6, x: 0.5 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080', '#ffc0cb', '#a52a2a'], scalar: 1.5 });
                setTimeout(() => { confetti({ particleCount: 100, angle: 60, spread: 70, origin: { x: 0, y: 0.5 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080', '#ffc0cb', '#a52a2a'], scalar: 1.5 }); }, 200);
                setTimeout(() => { confetti({ particleCount: 100, angle: 120, spread: 70, origin: { x: 1, y: 0.5 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080', '#ffc0cb', '#a52a2a'], scalar: 1.5 }); }, 400);
            }

            window.appVue = new Vue({
                el: '#tools',
                data: {
                    selected: 1,
                    selectedIndex: null,
                    running: false,
                    showResult: false,
                    showBackButton: false,
                    currentSubDrawCount: 0,
                    prizeImages: {
                        'Giải Ba': ['img_webp/giai_ba_1.webp', 'img_webp/giai_ba_2.webp'],
                        'Khuyến Khích': ['img_webp/khuyen_khich_1.webp', 'img_webp/khuyen_khich_2.webp', 'img_webp/khuyen_khich_3.webp', 'img_webp/khuyen_khich_4.webp', 'img_webp/khuyen_khich_5.webp']
                    },
                    btns: [
                        { label: 'Giải Nhất', cn: '一等奖', value: 1, done: false, image: 'img_webp/giai_nhat.webp' },
                        { label: 'Giải Nhì', cn: '二等奖', value: 2, done: false, image: 'img_webp/giai_nhi.webp' },
                        { label: 'Giải Ba', cn: '三等奖', value: 5, done: false, image: 'img_webp/giai_ba.webp' },
                        { label: 'Khuyến Khích', cn: '鼓励奖', value: 12, done: false, image: 'img_webp/khuyen_khich.webp' },
                        { label: 'Giải Bonus', cn: '奖金', value: 1, done: false, image: 'img_webp/bonus.webp' }
                    ],
                    prizeItems: {},
                    multiDrawConfig: {}
                },
                computed: {
                    topRowBtns: function () {
                        return this.btns.slice(0, 2).map((item, index) => {
                            return { ...item, originalIndex: index };
                        }); 
                    },
                    bottomRowBtns: function () {
                        return this.btns.slice(2).map((item, index) => {
                            return { ...item, originalIndex: index + 2 };
                        });
                    }
                },
                mounted() {
                    this.btns.forEach(item => {
                         this.$set(item, 'originalValue', item.value);
                    });
                    canvas.innerHTML = createHTML();
                    TagCanvas.Start('myCanvas', '', { textColour: null, initial: speed(), dragControl: 1, textFont: 'bold 27px "Times New Roman", Times, serif' });
                    var lastIndex = localStorage.getItem('lastSelectedIndex');
                    if (lastIndex !== null) {
                        var index = parseInt(lastIndex, 10);
                        var lastPrize = this.btns[index];
                        if (lastPrize && !lastPrize.done) {
                            this.onClick(lastPrize, index);
                        }
                    }
                },
                methods: {
                    getDisplayValue(item) {
                        const prizeLabel = item.label;
                        const isMultiDrawPrize = Object.keys(this.multiDrawConfig).includes(prizeLabel);
                        if (isMultiDrawPrize && this.selectedIndex === item.originalIndex && item.value > 0) {
                            const config = this.multiDrawConfig[prizeLabel];
                            let drawsDone;
                            if (Array.isArray(config.winners)) {
                                drawsDone = this.currentSubDrawCount;
                            } else {
                                drawsDone = Math.floor((item.originalValue - item.value) / config.winners);
                            }
                            return `L${drawsDone + 1}/${config.draws}`;
                        }
                         return item.done ? 'Hết' : item.value;
                    },
                    confirmResult: function () {
                        document.getElementById('result').style.display = 'none';
                        document.getElementById('main').classList.remove('mask');
                        this.showBackButton = false;
                        this.running = false;
                        needConfirm = false;
                        TagCanvas.SetSpeed('myCanvas', speed());
                        
                        // After confirming, update the title for the next sub-draw
                        const lastPrize = this.btns[this.selectedIndex];
                        if(lastPrize && !lastPrize.done) {
                            // Re-run onClick to update the title to the next sub-prize
                            this.onClick(lastPrize, this.selectedIndex);
                        } else if (lastPrize) {
                            // If prize is done, just show the main title
                            document.getElementById('current-prize-title').innerHTML = lastPrize.label + ' - ' + lastPrize.cn;
                        }
                         document.getElementById('current-prize-title').style.color = '#FFFFFF';
                    },
                    showResetAlert: function () {
                        showResetAlert();
                    },
                    onClick: function (item, index) {
                        if (item.done || this.running) return;
                        $('#result').css('display', 'none');
                        $('#main').removeClass('mask');
                        this.selectedIndex = index;
                        localStorage.setItem('lastSelectedIndex', index);
                        
                        const prizeLabel = item.label;
                        const isMultiDrawPrize = Object.keys(this.multiDrawConfig).includes(prizeLabel);
                        
                        if (isMultiDrawPrize) {
                            const config = this.multiDrawConfig[prizeLabel];
                            if (Array.isArray(config.winners)) {
                                let winnersDrawn = (item.originalValue || item.value) - item.value;
                                let cumulativeWinners = 0;
                                this.currentSubDrawCount = 0;
                                for (let i = 0; i < config.winners.length; i++) {
                                    if (winnersDrawn >= cumulativeWinners) {
                                        this.currentSubDrawCount = i;
                                        cumulativeWinners += config.winners[i];
                                    } else {
                                        break;
                                    }
                                }
                            } else {
                                this.currentSubDrawCount = Math.floor(((item.originalValue || item.value) - item.value) / config.winners);
                            }
                        }

                        let currentTitle = `${item.label} - ${item.cn}`;
                        if (isMultiDrawPrize) {
                            const itemDisplayName = this.prizeItems[prizeLabel][this.currentSubDrawCount];
                            if (itemDisplayName) {
                                currentTitle += ` - ${itemDisplayName}`;
                            }
                        }
                        document.getElementById('current-prize-title').innerHTML = currentTitle;
                        
                        // ALWAYS use the main prize image
                        document.getElementById('main').style.backgroundImage = 'url(' + (item.image || 'img_webp/icon-wall.webp') + ')';
                        document.getElementById('current-prize-title').style.color = '#FFFFFF';
                    },
                    startLottery: function () {
                        if (this.selectedIndex === null) { return showNoPrizeAlert(); }
                        if (this.running || needConfirm) return;
                        var currentPrize = this.btns[this.selectedIndex];
                        if (currentPrize.value <= 0) { return showAlert(); }
                        
                        const prizeLabel = currentPrize.label;
                        const isMultiDrawPrize = Object.keys(this.multiDrawConfig).includes(prizeLabel);
                        
                        if (isMultiDrawPrize) {
                            const config = this.multiDrawConfig[prizeLabel];
                            if (Array.isArray(config.winners)) {
                                this.selected = config.winners[this.currentSubDrawCount];
                            } else {
                                this.selected = config.winners;
                            }
                        } else {
                            this.selected = currentPrize.value;
                        }

                        if (currentPrize.value < this.selected) { return showAlert(); }
                        
                        var musicFile = `audio/m${Math.floor(Math.random() * 6) + 1}.mp3`;
                        if (prizeLabel === 'Đặc Biệt') { musicFile = 'audio/m_quay_dacbiet.mp3'; }
                        else if (prizeLabel === 'Giải Nhất') { musicFile = 'audio/m_quay_nhat.mp3'; }

                        var spinDuration = 7500; // 7.5 seconds for all prizes

                        this.running = true;
                        $('#result').hide();
                        $('#main').removeClass('mask');
                        bgMusic.src = musicFile;
                        bgMusic.loop = true;
                        bgMusic.currentTime = 0;
                        bgMusic.play();
                        TagCanvas.SetSpeed('myCanvas', [5, 1]);

                        // --- Set Timeout to start the slowdown process ---
                        setTimeout(() => {
                            // --- Start Gradual Slowdown ---
                            var currentSpeedX = 5;
                            var currentSpeedY = 1;
                            var slowdownInterval = setInterval(() => {
                                currentSpeedX *= 0.95; 
                                currentSpeedY *= 0.95;
                                TagCanvas.SetSpeed('myCanvas', [currentSpeedX, currentSpeedY]);

                                if (Math.abs(currentSpeedX) < 0.05 && Math.abs(currentSpeedY) < 0.05) {
                                    clearInterval(slowdownInterval);
                                    TagCanvas.SetSpeed('myCanvas', [0, 0]); 

                                    // --- Officially End Spin ---
                                    bgMusic.pause();
                                    var ret = lottery(this.selected, prizeLabel);
                                    if (ret.length === 0) {
                                        this.running = false;
                                        return $('#result').show().html('<span style="width: 250px;"><b style="font-size:32px;color:#d32f2f">Đã hết người</b><br><small style="font-size:20px;color:#555">已抽完</small></span>');
                                    }
                                    
                                    var finalPrizeLabel = `${prizeLabel} - ${currentPrize.cn}`;
                                    if (isMultiDrawPrize) {
                                        const itemDisplayName = this.prizeItems[prizeLabel][this.currentSubDrawCount];
                                        if (itemDisplayName) {
                                            finalPrizeLabel = `${prizeLabel} - ${currentPrize.cn} - ${itemDisplayName}`;
                                        }
                                    }
                                    
                                    renderWinners(ret, finalPrizeLabel);
                                    currentPrize.value -= ret.length;
                                    if (currentPrize.value <= 0) { currentPrize.done = true; }
                                    
                                    this.showResult = true;
                                    this.showBackButton = true;
                                    TagCanvas.Reload('myCanvas');
                                    setTimeout(() => {
                                        localStorage.setItem(new Date().toString(), JSON.stringify({ prize: finalPrizeLabel, winners: ret.map(item => [item.name, item.phone, item.prizeItem]) }));
                                        $('#main').addClass('mask');
                                    }, 300);
                                }
                            }, 50); 
                        }, spinDuration);
                    },
                    editQuantity: function (item, index) { 
                        if (this.running) return;
                        const originalItem = this.btns[index];
                        var currentVal = originalItem.value;
                        var newVal = prompt(`Nhập số lượng mới cho giải "${originalItem.label}":`, currentVal);
                        if (newVal !== null) {
                            var newQuantity = parseInt(newVal, 10);
                            if (!isNaN(newQuantity) && newQuantity >= 0) {
                                originalItem.value = newQuantity;
                                if(typeof originalItem.originalValue !== 'undefined') {
                                    originalItem.originalValue = newQuantity;
                                }
                                originalItem.done = newQuantity <= 0;
                            } else {
                                alert('Vui lòng nhập một số hợp lệ.');
                            }
                        }
                    }
                }
            });
        })();
    </script>

    <script>
        document.addEventListener('click', function (e) {
            const result = document.getElementById('result');
            const tools = document.getElementById('tools');
            const main = document.getElementById('main');

            if (!result) return;

            const style = window.getComputedStyle(result);

            // Chỉ xử lý khi kết quả đang hiện
            if (style.display !== 'none') {

                // 🚫 ĐANG CHỜ XÁC NHẬN → KHÔNG CHO ẨN
                if (typeof needConfirm !== 'undefined' && needConfirm) return;

                // ✅ Click ngoài tools + ngoài result mới ẩn
                if (!tools.contains(e.target) && !result.contains(e.target)) {
                    result.style.display = 'none';
                    main.classList.remove('mask');

                    // Reset canvas về trạng thái quay
                    if (window.TagCanvas) {
                        TagCanvas.Reload('myCanvas');
                    }
                }
            }
        });
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const resetButton = document.querySelector('.btn-reset');
        const contextMenu = document.getElementById('custom-context-menu');

        // Function to display the context menu
        function displayContextMenu(targetButton) {
            if (!targetButton || !contextMenu) return;

            const rect = targetButton.getBoundingClientRect();

            contextMenu.style.display = 'block'; // Show it first to get its dimensions
            const menuHeight = contextMenu.offsetHeight;
            
            // Position above the button, aligned left, and match width
            contextMenu.style.top = `${rect.top - menuHeight}px`;
            contextMenu.style.left = `${rect.left}px`;
            contextMenu.style.width = `${rect.width}px`;
        }

        if (resetButton && contextMenu) {
            // Right-click event
            resetButton.addEventListener('contextmenu', function(event) {
                event.preventDefault();
                displayContextMenu(event.currentTarget);
            });

            // Keyboard event (Space or Enter)
            resetButton.addEventListener('keydown', function(event) {
                if (event.code === 'Enter' || event.code === 'Space') {
                    event.preventDefault();
                    displayContextMenu(event.currentTarget);
                }
            });
        }

        // Hide menu on any left-click
        document.addEventListener('click', function(event) {
            if (contextMenu && contextMenu.style.display === 'block') {
                if (!contextMenu.contains(event.target) && !resetButton.contains(event.target)) {
                    contextMenu.style.display = 'none';
                }
            }
        });

        // Hide menu on any right-click outside the button that spawned it
        document.addEventListener('contextmenu', function(event) {
            if (contextMenu && !resetButton.contains(event.target)) {
                contextMenu.style.display = 'none';
            }
        });
    });
    </script>
